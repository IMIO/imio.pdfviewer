[project]
name = "imio.pdfviewer"
dynamic = ["version"]
description = "PDF viewer for Plone 6 Classic UI, shipped as a patternslib pattern (pat-pdf-viewer)"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Antoine Duchêne", email = "antoine.duchene@imio.be" },
]
keywords = [
    "CMS",
    "PDF",
    "Plone",
    "Python",
    "mockup",
    "patternslib",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Plone",
    "Framework :: Plone :: 6.2",
    "Framework :: Plone :: Addon",
    "Operating System :: OS Independent",
    "Programming Language :: JavaScript",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Products.CMFPlone>=6.2",
]

[project.optional-dependencies]
test = [
    "horse-with-no-namespace",
    "plone.app.testing",
    "plone.classicui",
    "pytest",
    "pytest-cov",
    "pytest-plone>=1.0.0a2",
]
release = [
    "zest.pocompile",
    "zest.releaser[recommended]",
    "zestreleaser.towncrier",
]

[project.urls]
Homepage = "https://github.com/IMIO/imio.pdfviewer"
PyPI = "https://pypi.org/project/imio.pdfviewer"
Source = "https://github.com/IMIO/imio.pdfviewer"
Tracker = "https://github.com/IMIO/imio.pdfviewer/issues"


[project.entry-points."z3c.autoinclude.plugin"]
target = "plone"

[tool.uv]
managed = false

[build-system]
# setuptools, not hatchling: zc.buildout's develop runs setup.py directly.
requires = ["setuptools>=68.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "imio.pdfviewer.__version__"}

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
# PEP 420: the imio namespace has no __init__.py.
namespaces = true

[tool.setuptools.package-data]
# The committed JavaScript bundle ships with the package. Node is not needed
# to install it.
"*" = [
    "*.zcml",
    "*.xml",
    "*.pt",
    "*.js",
    "*.map",
    "*.mjs",
    "*.svg",
    "*.po",
    "*.pot",
    "*.mo",
]

[tool.towncrier]
directory = "news/"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} ({project_date})"
template = "news/.changelog_template.jinja"
issue_format = "[#{issue}](https://github.com/IMIO/imio.pdfviewer/issues/{issue})"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes:"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New features:"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes:"
showcontent = true

[[tool.towncrier.type]]
directory = "internal"
name = "Internal:"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation:"
showcontent = true

[[tool.towncrier.type]]
directory = "tests"
name = "Tests"
showcontent = true

[tool.ruff]
target-version = "py312"
line-length = 88
fix = true
extend-exclude = ["node_modules"]
lint.select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
]
lint.ignore = [
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.isort]
case-sensitive = false
no-sections = true
force-single-line = true
from-first = true
lines-after-imports = 2
lines-between-types = 1
order-by-type = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "RUF001", "S101"]

[tool.ruff.format]
preview = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source_pkgs = ["imio.pdfviewer", "tests"]
branch = true
parallel = true

[tool.zest-releaser]
python-file-with-version = "src/imio/pdfviewer/__init__.py"
