name: "Main CI"

on:
  push:
  workflow_dispatch:

jobs:

  config:
    name: "Config: Compute values used in workflow"
    uses: ./.github/workflows/config.yml

  lint:
    name: "Backend: Lint"
    needs:
      - config
    uses: plone/meta/.github/workflows/backend-lint.yml@2.x
    with:
      python-version: ${{ needs.config.outputs.python-version }}
      plone-version: ${{ needs.config.outputs.plone-version }}

  test:
    name: "Backend: Test"
    needs:
      - config
    uses: plone/meta/.github/workflows/backend-pytest.yml@2.x
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        plone-version: ['6.2-latest']
    with:
      python-version: ${{ matrix.python-version }}
      plone-version: ${{ matrix.plone-version }}

  coverage:
    name: "Backend: Test Coverage"
    uses: plone/meta/.github/workflows/backend-pytest-coverage.yml@2.x
    needs:
      - config
    with:
      python-version: ${{ needs.config.outputs.python-version }}
      plone-version: ${{ needs.config.outputs.plone-version }}

  frontend:
    name: "Frontend: Test and bundle"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The bundle is committed. It must be the build of the committed sources.
      - name: Check the committed bundle
        run: |
          git add --all --intent-to-add src/imio/pdfviewer/browser/static
          if ! git diff --exit-code --stat -- src/imio/pdfviewer/browser/static; then
            echo "::error::The bundle is not up to date. Run 'npm run build' and commit src/imio/pdfviewer/browser/static."
            exit 1
          fi

  e2e:
    name: "Frontend: Cypress"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install JavaScript packages
        run: npm ci

      - name: Install Plone
        run: make install

      - name: Create the test site
        run: make create-site

      # Cypress runs against the committed bundle.
      - name: Run Cypress
        uses: cypress-io/github-action@v7.4.10
        with:
          install: false
          browser: chrome
          start: make start
          wait-on: "http://localhost:8080/Plone"
          wait-on-timeout: 180

      - name: Keep the screenshots of the failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots

  report:
    name: "Final report"
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - config
      - lint
      - test
      - coverage
      - frontend
      - e2e
    steps:
      - name: Report
        shell: bash
        run: |
          echo '# Workflow Report' >> $GITHUB_STEP_SUMMARY
          echo '| Job ID | Conclusion |' >> $GITHUB_STEP_SUMMARY
          echo '| --- | --- |' >> $GITHUB_STEP_SUMMARY
          echo '| Config | ${{ needs.config.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Lint | ${{ needs.lint.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Test | ${{ needs.test.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Coverage | ${{ needs.coverage.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Frontend | ${{ needs.frontend.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Cypress | ${{ needs.e2e.result }} |' >> $GITHUB_STEP_SUMMARY
