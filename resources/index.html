<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pat-pdf-viewer demo</title>
    <script src="/imio.pdfviewer.min.js"></script>
  </head>
  <body>
    <main style="max-width: 60rem; margin: 0 auto; padding: 1rem; font-family: sans-serif">
      <h1>pat-pdf-viewer</h1>
      <p>The icons come from Plone. This page shows the buttons without icons.</p>

      <h2>Continuous scroll</h2>
      <div class="pat-pdf-viewer">
        <a href="/sample.pdf">Download the document</a>
      </div>

      <h2>Single page, some buttons</h2>
      <div
        class="pat-pdf-viewer"
        data-pat-pdf-viewer='{"display": "single", "buttons": ["download", "zoom"]}'
      >
        <a href="/sample.pdf">Download the document</a>
      </div>
    </main>
  </body>
</html>
